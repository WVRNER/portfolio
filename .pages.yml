# ==============================================================================
# WVRNER / NIMA — Pages CMS Configuration
# Clean, Writing-First Authoring Experience (Apple Notes / Notion / Medium style)
# ==============================================================================

media:
  input: images
  output: /images
  categories:
    - image
    - document
    - compressed
    - code
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - svg
    - gif
    - avif
    - pdf
    - zip
    - yaml
    - yml
    - json
    - tf
    - sh
    - py
  rename: safe

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: posts
    filename: "{fields.slug}.md"

    description: "Writing-first article editor for the WVRNER engineering blog. The top area is dedicated entirely to your content (Title, Subtitle, Cover Image, and the rich Article Content editor with visual tables). All secondary publishing settings, tags, and technical metadata are located below."

    view:
      fields:
        - title
        - category
        - date
        - updated
        - published
        - featured

      primary: title

      default:
        sort: date
        order: desc

      search:
        - title
        - subtitle
        - excerpt
        - category
        - post_tags

    fields:

      # ========================================================================
      # 1. PRIMARY WRITING WORKSPACE (Focus on Content)
      # ========================================================================

      - name: title
        label: Title
        type: string
        required: true
        description: "The main headline of your article. Keep it bold, clear, and descriptive."

      - name: subtitle
        label: Subtitle / Hook
        type: string
        required: true
        description: "A short, engaging thesis statement or subtitle directly supporting the headline."

      - name: cover_image
        label: Cover Image
        type: image
        description: "Primary visual for the article (architecture schematic, screenshot, or banner)."
        options:
          path: images/posts
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - svg
          rename: safe

      - name: body
        label: Article Content
        type: rich-text
        required: true
        description: "Your main writing space. Type '/' for Notion-style slash commands (insert interactive tables, headings, code blocks, callouts, lists, and images). Use the Editor / Source toggle in the top-right corner to switch between visual WYSIWYG and raw Markdown."
        options:
          format: markdown
          switcher: true
          path: images/posts
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - svg
            - gif
          rename: safe


      # ========================================================================
      # 2. ADVANCED SETTINGS — PUBLISHING & TAXONOMY
      # ========================================================================

      - name: excerpt
        label: "⚙️ Publishing — Feed Teaser (Excerpt)"
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 300
        description: "Short 1-2 sentence preview displayed on the /blog/ index card."

      - name: category
        label: "⚙️ Publishing — Primary Category"
        type: select
        required: true
        default: "DEVOPS & INFRASTRUCTURE"
        description: "The primary technical category badge for this post."
        options:
          values:
            - value: "DEVOPS & INFRASTRUCTURE"
              label: "DevOps & Infrastructure"

            - value: "CERTIFICATION & LAB LOG"
              label: "Certification & Lab Log"

            - value: "CLOUD ARCHITECTURE & AWS"
              label: "Cloud Architecture & AWS"

            - value: "LINUX & KERNEL SYSTEMS"
              label: "Linux & Kernel Systems"

            - value: "ENTERPRISE NETWORKING"
              label: "Enterprise Networking"

            - value: "CI/CD & AUTOMATION"
              label: "CI/CD & Automation"

            - value: "KUBERNETES & CONTAINERS"
              label: "Kubernetes & Containers"

            - value: "DEVSECOPS & OBSERVABILITY"
              label: "DevSecOps & Observability"

            - value: "INFRASTRUCTURE AS CODE"
              label: "Infrastructure as Code"

            - value: "SOFTWARE ENGINEERING"
              label: "Software Engineering"

            - value: "PROJECT BUILD LOG"
              label: "Project Build Log"

            - value: "CAREER & LEARNING"
              label: "Career & Learning"

      - name: post_tags
        label: "⚙️ Publishing — Topic Tags"
        type: select
        required: true
        description: "Select 1 to 12 technology tags rendered as colored chips."
        options:
          multiple: true
          min: 1
          max: 12
          values:
            - "#DevOps"
            - "#IBMCloud"
            - "#Coursera"
            - "#Docker"
            - "#Kubernetes"
            - "#OpenShift"
            - "#CICD"
            - "#GitHubActions"
            - "#Jenkins"
            - "#Tekton"
            - "#GitOps"
            - "#Terraform"
            - "#Ansible"
            - "#AWS"
            - "#Cloudflare"
            - "#GitHubPages"
            - "#ZeroDrift"
            - "#Linux"
            - "#Bash"
            - "#Python"
            - "#PythonFlask"
            - "#TDD"
            - "#Networking"
            - "#CCNA"
            - "#MCSA"
            - "#MikroTik"
            - "#Virtualization"
            - "#Security"
            - "#Prometheus"
            - "#Grafana"
            - "#OpenSource"
            - "#Neubrutalism"
            - "#CareerNotes"

      - name: published
        label: "⚙️ Publishing — Published Status"
        type: boolean
        default: false
        description: "Toggle ON when ready to publish publicly. Defaults to OFF (draft) for new articles."

      - name: featured
        label: "⚙️ Publishing — Featured Article"
        type: boolean
        default: false
        description: "Highlight this article at the top of the blog feed and on the homepage showcase."

      - name: date
        label: "⚙️ Publishing — Publication Date"
        type: date
        required: true
        default: now
        description: "Chronological sort date (automatically defaults to current timestamp)."

      - name: display_date
        label: "⚙️ Publishing — Display Date"
        type: string
        required: true
        description: "Human-friendly date string displayed to readers (e.g., October 2026). Enter the date when publishing."

      - name: read_time
        label: "⚙️ Publishing — Read Time"
        type: string
        required: true
        description: "Estimated reading time (e.g., 6 min read or 12 min deep dive). Enter your estimate when publishing."

      - name: updated
        label: "⚙️ Publishing — Last Revised Date"
        type: date
        description: "Optional revision date when updating an older technical article."


      # ========================================================================
      # 3. ADVANCED SETTINGS — URL & IDENTITY
      # ========================================================================

      - name: slug
        label: "⚙️ URL & Identity — Filename Slug"
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "URL slug that names the markdown file and sets the /posts/<slug>.html path."


      # ========================================================================
      # 4. ADVANCED SETTINGS — COVER IMAGE METADATA
      # ========================================================================

      - name: cover_image_alt
        label: "⚙️ Cover Image — Alt Text"
        type: string
        description: "Accessibility text describing the cover image for screen readers."

      - name: cover_image_caption
        label: "⚙️ Cover Image — Caption / Credit"
        type: string
        description: "Optional caption, diagram title, or photographer credit below the cover image."


      # ========================================================================
      # 5. ADVANCED SETTINGS — ARTICLE FEATURES
      # ========================================================================

      - name: toc
        label: "⚙️ Features — Table of Contents"
        type: boolean
        default: false
        description: "Enable automated table of contents navigation based on article headings."

      - name: callout_box
        label: "⚙️ Features — Highlighted Callout Box"
        type: object
        description: "Visually distinct highlighted box for important notes, warnings, or certification summaries."
        fields:
          - name: enable
            label: Show Callout Box
            type: boolean
            default: false
            description: "Turn ON to display the callout box."

          - name: tag_label
            label: Small Tag Label
            type: string
            description: "EXAMPLE: // Architecture Note, // Certification, // Warning."

          - name: title
            label: Box Title
            type: string
            description: "Headline for the callout box."

          - name: content
            label: Box Content
            type: text
            description: "Callout explanation in 2-4 sentences."

          - name: link_text
            label: Link Text
            type: string
            description: "EXAMPLE: View the full curriculum →"

          - name: link_url
            label: Link URL
            type: string
            description: "Destination URL starting with https://"

      - name: series
        label: "⚙️ Features — Multi-Part Series"
        type: object
        description: "Connect this article into a multi-part editorial series."
        fields:
          - name: name
            label: Series Name
            type: string
            description: "EXAMPLE: Building My Home Lab, Kubernetes From Scratch."

          - name: part
            label: Part Number
            type: number
            description: "EXAMPLE: 1 for Part 1, 2 for Part 2."

      - name: related_posts
        label: "⚙️ Features — Related Posts"
        type: reference
        description: "Manually cross-link other technical posts from the blog."
        options:
          collection: posts
          multiple: true
          search: title
          value: "{fields.slug}"
          label: "{fields.title}"

      - name: code_snippets
        label: "⚙️ Features — Config / Code Snippets"
        type: object
        list: true
        description: "Complete configuration files (main.tf, Dockerfile, etc.) stored alongside the post."
        fields:
          - name: file_name
            label: File Name
            type: string
            description: "EXAMPLE: main.tf, Dockerfile, deploy.yml."

          - name: language
            label: Language / Format
            type: string
            description: "EXAMPLE: Terraform, Dockerfile, YAML, Bash, Python."

          - name: code
            label: Code
            type: text
            description: "Paste complete configuration or code here."

      - name: downloads
        label: "⚙️ Features — Downloadable Files"
        type: object
        description: "Downloadable attachments (lab ZIPs, scripts, certificates)."
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Display Name
            type: string
            description: "EXAMPLE: Download Terraform Lab ZIP."

          - name: file
            label: File
            type: file
            description: "Upload or select file for download."
            options:
              path: images/downloads
              extensions:
                - pdf
                - zip
                - yaml
                - yml
                - json
                - tf
                - sh
                - py
              rename: safe

          - name: description
            label: Short Description
            type: string
            description: "Brief note describing the download."

      - name: external_links
        label: "⚙️ Features — References & External Links"
        type: object
        description: "External reference documentation and source links."
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: Link Text
            type: string
            description: "EXAMPLE: Terraform AWS Provider Docs."

          - name: url
            label: URL
            type: string
            description: "Full destination URL."

          - name: open_in_new_tab
            label: Open in New Tab
            type: boolean
            default: true


      # ========================================================================
      # 6. ADVANCED SETTINGS — TECHNICAL & LAB DETAILS
      # ========================================================================

      - name: difficulty
        label: "⚙️ Lab Details — Difficulty Level"
        type: select
        description: "Target audience complexity level."
        options:
          values:
            - "Beginner"
            - "Intermediate"
            - "Advanced"

      - name: project_status
        label: "⚙️ Lab Details — Project Status"
        type: select
        description: "Current development or deployment stage."
        options:
          values:
            - "Planned"
            - "In Progress"
            - "Completed"
            - "Archived"

      - name: technologies
        label: "⚙️ Lab Details — Technologies Used"
        type: select
        description: "Specific technology stack components demonstrated."
        options:
          multiple: true
          values:
            - "Linux"
            - "Ubuntu"
            - "Windows Server"
            - "Docker"
            - "Kubernetes"
            - "OpenShift"
            - "Terraform"
            - "Ansible"
            - "AWS"
            - "IBM Cloud"
            - "GitHub Actions"
            - "Jenkins"
            - "Git"
            - "Python"
            - "Bash"
            - "Cisco"
            - "MikroTik"
            - "VMware"
            - "UTM"
            - "Prometheus"
            - "Grafana"

      - name: repository_url
        label: "⚙️ Lab Details — GitHub Repository"
        type: string
        description: "Direct link to the public GitHub repository or lab source code."

      - name: live_demo_url
        label: "⚙️ Lab Details — Live Demo URL"
        type: string
        description: "Direct link to live running deployment if available."

      - name: prerequisites
        label: "⚙️ Lab Details — Prerequisites"
        type: text
        description: "Tools, accounts, or knowledge needed before starting."

      - name: environment
        label: "⚙️ Lab Details — Tested Environment"
        type: text
        description: "Host OS, hardware architecture, kernel, and software versions used."

      - name: key_takeaways
        label: "⚙️ Lab Details — Key Takeaways"
        type: text
        description: "Key architectural lessons and operational outcomes."

      - name: credential_url
        label: "⚙️ Lab Details — Certificate / Credential URL"
        type: string
        description: "Verification link for certifications (Credly, Coursera, Cisco, IBM)."


      # ========================================================================
      # 7. ADVANCED SETTINGS — SEO & SOCIAL SHARING
      # ========================================================================

      - name: seo
        label: "⚙️ SEO & Social Sharing"
        type: object
        description: "Custom search engine tags and social media card previews."
        fields:
          - name: meta_title
            label: SEO Title
            type: string
            description: "Custom title tag for search engines (defaults to article title if blank)."

          - name: meta_description
            label: Meta Description
            type: text
            description: "Custom search snippet (150-160 characters recommended)."

          - name: og_image
            label: Social Share Image (OpenGraph)
            type: image
            description: "Preview image when sharing on LinkedIn, Telegram, Twitter, etc."
            options:
              path: images/posts
              extensions:
                - png
                - jpg
                - webp
              rename: safe

          - name: canonical_url
            label: Canonical URL
            type: string
            description: "Original URL if cross-posted from another platform."

          - name: no_index
            label: Hide From Search Engines
            type: boolean
            default: false
            description: "Check this to prevent search engines from indexing this post."


      # ========================================================================
      # 8. SYSTEM & ARCHITECTURE (AUTOMATED DEFAULTS)
      # ========================================================================

      - name: author
        label: "Author"
        type: string
        default: "Nima Hosseini"
        description: "Default author attribution."

      - name: layout
        label: "Layout Template"
        type: string
        default: "post.njk"
        hidden: true
        description: "Internal Eleventy layout binding (hidden from author)."
