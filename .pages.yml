media:
  input: images/blog
  output: /images/blog

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: posts
    view:
      fields: [title, date, category]
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: category
        label: Category
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: read_time
        label: Read Time
        type: string
        default: "5 min read"

      - name: subtitle
        label: Subtitle
        type: text
        required: true

      - name: excerpt
        label: Blog Page Excerpt
        type: text
        required: true

      - name: tags
        label: Tags
        type: string
        list: true

      - name: body
        label: Article Content
        type: rich-text
        required: true
