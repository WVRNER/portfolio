# ==============================================================================
# Pages CMS Configuration (.pages.yml)
# Complete schema for Nima Hosseini (@wvrner) - DevOps & Infrastructure Portfolio
# Official documentation: https://pagescms.org/docs/configuration/
# ==============================================================================

# 1. Media Upload Directory
media:
  input: images/posts
  output: /images/posts

# 2. Content Collections
content:
  # Blog Posts Collection (posts/*.html)
  - name: posts
    label: Blog Posts
    type: collection
    path: posts
    description: "Engineering notes, lab logs, and technical explorations"
    filename: "{fields.slug}.html"
    view:
      fields: [title, date, category, tags]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
        description: "e.g. Deep-Diving DevOps: Why I'm Taking the IBM DevOps and Software Engineering Professional Certificate"

      - name: slug
        label: URL Slug / Filename
        type: string
        required: true
        description: "e.g. ibm-devops-certificate (creates posts/ibm-devops-certificate.html)"

      - name: category
        label: Category Badge
        type: select
        default: "CERTIFICATION & LAB LOG"
        options:
          values:
            - "CERTIFICATION & LAB LOG"
            - "DEVOPS & INFRASTRUCTURE"
            - "CLOUD ARCHITECTURE"
            - "NETWORKING & SYSTEMS"
            - "CI/CD & AUTOMATION"
            - "LINUX INTERNALS"
            - "SECURITY & DEVSECOPS"

      - name: date
        label: Publication Date
        type: date
        default: now
        required: true

      - name: read_time
        label: Estimated Reading Time
        type: string
        default: "6 min read"
        description: "e.g. 6 min read"

      - name: subtitle
        label: Subtitle / One-Line Hook
        type: string
        required: true
        description: "e.g. Bridging network fundamentals, virtualization, and enterprise systems administration into end-to-end cloud-native engineering..."

      - name: excerpt
        label: Teaser Excerpt (for Blog Feed Card)
        type: text
        description: "Short 2-3 sentence overview displayed on the blog feed teaser card."

      # Defined Tags List matching the IBM Post & Cloud/DevOps Topics
      - name: tags
        label: Topic Tags (Neubrutalist Chips)
        type: select
        options:
          multiple: true
          values:
            # Tags from IBM DevOps Post:
            - "#DevOps"
            - "#IBMCloud"
            - "#Coursera"
            - "#Docker"
            - "#Kubernetes"
            - "#CICD"
            - "#PythonFlask"
            - "#TDD"
            - "#Networking"
            # Additional Cloud & Systems Tags:
            - "#Linux"
            - "#Terraform"
            - "#AWS"
            - "#ZeroDrift"
            - "#Bash"
            - "#GitOps"
            - "#MCSA"
            - "#CCNA"
            - "#Virtualization"
            - "#MikroTik"
            - "#OpenSource"
            - "#Neubrutalism"

      - name: body
        label: Article Content
        type: rich-text
        description: "Full article body with headings, callout boxes, code snippets, and diagrams"
