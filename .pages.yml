media:
  input: images/posts
  output: /images/posts

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: posts

    description: "Engineering notes, lab logs, and technical explorations"

    filename: "{fields.slug}.html"

    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Post Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true
        description: "Example: docker-networking"

      - name: category
        label: Category Badge
        type: select
        required: true
        default: "CERTIFICATION & LAB LOG"
        options:
          values:
            - "CERTIFICATION & LAB LOG"
            - "DEVOPS & INFRASTRUCTURE"
            - "CLOUD ARCHITECTURE"
            - "NETWORKING & SYSTEMS"
            - "CI/CD & AUTOMATION"
            - "LINUX INTERNALS"
            - "SECURITY & DEVSECOPS"

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: read_time
        label: Estimated Reading Time
        type: string
        default: "6 min read"
        description: "Example: 6 min read"

      - name: subtitle
        label: Subtitle / One-Line Hook
        type: text
        required: true

      - name: excerpt
        label: Blog Feed Excerpt
        type: text
        required: true
        description: "Short summary shown on the main blog page."

      - name: tags
        label: Topic Tags
        type: select
        options:
          multiple: true
          values:
            - "#DevOps"
            - "#IBMCloud"
            - "#Coursera"
            - "#Docker"
            - "#Kubernetes"
            - "#CICD"
            - "#PythonFlask"
            - "#TDD"
            - "#Networking"
            - "#Linux"
            - "#Terraform"
            - "#AWS"
            - "#ZeroDrift"
            - "#Bash"
            - "#GitOps"
            - "#MCSA"
            - "#CCNA"
            - "#Virtualization"
            - "#MikroTik"
            - "#OpenSource"
            - "#Neubrutalism"

      - name: body
        label: Article Content
        type: rich-text
        required: true
        options:
          format: html
