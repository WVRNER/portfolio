# ==============================================================================
# WVRNER / NIMA — Pages CMS Configuration
# ==============================================================================

media:
  input: images
  output: /images
  categories:
    - image
    - document
    - compressed
    - code
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - svg
    - gif
    - avif
    - pdf
    - zip
    - yaml
    - yml
    - json
    - tf
    - sh
    - py
  rename: safe


content:
  - name: posts
    label: Blog Posts
    type: collection
    path: posts
    filename: "{fields.slug}.md"

    description: "Create and manage articles for the WVRNER blog. Pages CMS saves each article as Markdown inside posts/. Eleventy then turns it into the final public article."

    view:
      fields:
        - title
        - category
        - date
        - updated
        - published
        - featured

      primary: title

      default:
        sort: date
        order: desc

      search:
        - title
        - subtitle
        - excerpt
        - category
        - post_tags


    fields:

      # ========================================================================
      # A. POST IDENTITY
      # ========================================================================

      - name: title
        label: Post Title
        type: string
        required: true
        description: "WHAT THIS DOES: Main headline of the article. EXAMPLE: Building a Zero-Drift AWS VPC with Terraform. READER SEES: This is the large article title and the title shown on the blog card."


      - name: slug
        label: URL Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "WHAT THIS DOES: Controls the Markdown filename and final article URL. EXAMPLE: terraform-zero-drift-vpc becomes /posts/terraform-zero-drift-vpc.html. READER SEES: This appears in the browser URL. Avoid changing it after publishing because old links can break."


      - name: subtitle
        label: Subtitle / Hook
        type: string
        required: true
        description: "WHAT THIS DOES: Short sentence directly supporting the title. EXAMPLE: How I replaced click-ops with a reproducible AWS network. READER SEES: Usually shown below the main title on the article."


      - name: excerpt
        label: Blog Feed Teaser
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 300
        description: "WHAT THIS DOES: Short summary used to advertise the article. EXAMPLE: I rebuilt my lab VPC in Terraform and deliberately introduced drift to test detection. READER SEES: This is normally the description on the /blog/ article card."


      - name: author
        label: Author
        type: string
        default: "Nima Hosseini"
        description: "WHAT THIS DOES: Stores who wrote the article. EXAMPLE: Nima Hosseini. READER SEES: Only appears publicly if the article template displays the author."


      - name: category
        label: Category
        type: select
        required: true
        description: "WHAT THIS DOES: Gives the article one main topic/category. EXAMPLE: Enterprise Networking for a CCNA lab article. READER SEES: Usually displayed as the category badge on the blog card and article."

        options:
          values:
            - value: "CERTIFICATION & LAB LOG"
              label: "Certification & Lab Log"

            - value: "DEVOPS & INFRASTRUCTURE"
              label: "DevOps & Infrastructure"

            - value: "CLOUD ARCHITECTURE & AWS"
              label: "Cloud Architecture & AWS"

            - value: "LINUX & KERNEL SYSTEMS"
              label: "Linux & Kernel Systems"

            - value: "ENTERPRISE NETWORKING"
              label: "Enterprise Networking"

            - value: "CI/CD & AUTOMATION"
              label: "CI/CD & Automation"

            - value: "KUBERNETES & CONTAINERS"
              label: "Kubernetes & Containers"

            - value: "DEVSECOPS & OBSERVABILITY"
              label: "DevSecOps & Observability"

            - value: "INFRASTRUCTURE AS CODE"
              label: "Infrastructure as Code"

            - value: "SOFTWARE ENGINEERING"
              label: "Software Engineering"

            - value: "PROJECT BUILD LOG"
              label: "Project Build Log"

            - value: "CAREER & LEARNING"
              label: "Career & Learning"


      # ========================================================================
      # B. DATE & READING INFORMATION
      # ========================================================================

      - name: date
        label: Publication Date
        type: date
        required: true
        default: now
        description: "WHAT THIS DOES: Controls when the article was published and is used to sort the blog newest-first. EXAMPLE: October 5, 2026. READER SEES: May be displayed as the article date."


      - name: display_date
        label: Display Date
        type: string
        required: true
        description: "WHAT THIS DOES: Human-friendly version of the date. EXAMPLE: October 2026. READER SEES: This is the formatted date displayed by your current article design."


      - name: updated
        label: Last Updated
        type: date
        description: "WHAT THIS DOES: Records when an older article was significantly revised. EXAMPLE: Update a Terraform article six months later and set today's date. READER SEES: Nothing unless post.njk is configured to show something such as 'Updated October 2026'."


      - name: read_time
        label: Reading Time
        type: string
        required: true
        description: "WHAT THIS DOES: Tells visitors roughly how long the article takes to read. EXAMPLE: 6 min read or 15 min deep dive. READER SEES: Displayed beside the article metadata if your template renders it."


      # ========================================================================
      # C. COVER IMAGE
      # ========================================================================

      - name: cover_image
        label: Cover Image
        type: image
        description: "WHAT THIS DOES: Main image representing the article. EXAMPLE: Network topology, terminal screenshot, architecture diagram, certificate, or project screenshot. READER SEES: Can appear at the top of the article and/or on the blog card."
        options:
          path: images/posts
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - svg
          rename: safe


      - name: cover_image_alt
        label: Cover Image Alt Text
        type: string
        description: "WHAT THIS DOES: Describes the image for accessibility and screen readers. EXAMPLE: Diagram showing two VLANs connected through a router-on-a-stick topology. READER SEES: Normally invisible unless the image cannot load or they use assistive technology."


      - name: cover_image_caption
        label: Cover Image Caption / Credit
        type: string
        description: "WHAT THIS DOES: Adds context or attribution below the image. EXAMPLE: Network architecture drawn in draw.io. READER SEES: Only appears if the article template renders image captions."


      # ========================================================================
      # D. TOPIC TAGS
      # ========================================================================

      - name: post_tags
        label: Topic Tags
        type: select
        required: true
        description: "WHAT THIS DOES: Adds multiple specific technologies/topics to the article. EXAMPLE: #Docker, #Linux, #Networking. READER SEES: These can appear as colored topic chips/tags below the article or on its card."

        options:
          multiple: true
          min: 1
          max: 12

          values:
            - "#DevOps"
            - "#IBMCloud"
            - "#Coursera"
            - "#Docker"
            - "#Kubernetes"
            - "#OpenShift"
            - "#CICD"
            - "#GitHubActions"
            - "#Jenkins"
            - "#Tekton"
            - "#GitOps"
            - "#Terraform"
            - "#Ansible"
            - "#AWS"
            - "#Cloudflare"
            - "#GitHubPages"
            - "#ZeroDrift"
            - "#Linux"
            - "#Bash"
            - "#Python"
            - "#PythonFlask"
            - "#TDD"
            - "#Networking"
            - "#CCNA"
            - "#MCSA"
            - "#MikroTik"
            - "#Virtualization"
            - "#Security"
            - "#Prometheus"
            - "#Grafana"
            - "#OpenSource"
            - "#Neubrutalism"
            - "#CareerNotes"


      # ========================================================================
      # E. SERIES
      # ========================================================================

      - name: series
        label: Article Series
        type: object
        description: "WHAT THIS DOES: Groups related articles into a multi-part series. EXAMPLE: Series Name = Building My Home Lab, Part Number = 2. READER SEES: Could show something like 'Building My Home Lab — Part 2'. IMPORTANT: This information is saved now, but nothing appears publicly until post.njk is configured to display series information."

        fields:
          - name: name
            label: Series Name
            type: string
            description: "EXAMPLE: Building My Home Lab, Kubernetes From Scratch, CCNA Lab Series."

          - name: part
            label: Part Number
            type: number
            description: "EXAMPLE: Set this to 1 for the first article, 2 for the second, etc."


      # ========================================================================
      # F. RELATED POSTS
      # ========================================================================

      - name: related_posts
        label: Related Posts
        type: reference
        description: "WHAT THIS DOES: Lets you manually connect this article to other articles. EXAMPLE: A Docker networking article can link to your Linux namespaces article. READER SEES: Could become a 'Related Articles' section at the bottom. IMPORTANT: post.njk must render this before visitors can see it."

        options:
          collection: posts
          multiple: true
          search: title
          value: "{fields.slug}"
          label: "{fields.title}"


      # ========================================================================
      # G. TABLE OF CONTENTS
      # ========================================================================

      - name: toc
        label: Show Table of Contents
        type: boolean
        default: false
        description: "WHAT THIS DOES: Marks a long article as needing a contents menu based on headings. EXAMPLE: Introduction → Network Design → VLAN Configuration → Routing → Testing → Conclusion. READER SEES: Ideally a clickable Table of Contents near the top of the article. IMPORTANT: This toggle only saves true/false right now. post.njk must implement the actual table of contents before anything appears."


      # ========================================================================
      # H. HIGHLIGHTED CALLOUT BOX
      # ========================================================================

      - name: callout_box
        label: Highlighted Callout Box
        type: object
        description: "WHAT THIS DOES: Creates a visually important box for something worth highlighting. EXAMPLE: certification details, architecture note, warning, key lesson, or project summary. READER SEES: Only appears if enabled and post.njk renders the callout box."

        fields:
          - name: enable
            label: Show Callout Box
            type: boolean
            default: false
            description: "Turn this ON when you want the box included in the article."

          - name: tag_label
            label: Small Label
            type: string
            description: "EXAMPLE: // Architecture Note, // Certification, // Warning, // Key Lesson."

          - name: title
            label: Box Title
            type: string
            description: "EXAMPLE: IBM DevOps and Software Engineering Professional Certificate."

          - name: content
            label: Box Text
            type: text
            description: "EXAMPLE: Explain the important point, program, warning, or architecture decision in 2-4 sentences."

          - name: link_text
            label: Link Text
            type: string
            description: "EXAMPLE: View the full curriculum →"

          - name: link_url
            label: Link URL
            type: string
            description: "EXAMPLE: Full external destination starting with https://"


      # ========================================================================
      # I. ARTICLE CONTENT
      # ========================================================================

      - name: body
        label: Article Content
        type: rich-text
        required: true
        description: "WHAT THIS DOES: This is the actual article. Write paragraphs, headings, lists, images, code blocks, explanations, commands, etc. EXAMPLE: Your full Docker, networking, Linux, AWS, DevOps, or lab write-up. READER SEES: This is the main content of the public article."

        options:
          format: markdown
          path: images/posts
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - svg
            - gif
          rename: safe

      # ========================================================================
      # J. CONFIG / CODE SNIPPETS
      # ========================================================================

      - name: code_snippets
        label: Config / Code Snippets
        type: object
        description: "WHAT THIS DOES: Stores complete code or configuration examples separately from the article body. EXAMPLE: main.tf, Dockerfile, deployment.yaml, install.sh. READER SEES: Nothing until _includes/post.njk is configured to render these snippets."
        list: true

        fields:
          - name: file_name
            label: File Name
            type: string
            description: "EXAMPLE: main.tf, Dockerfile, deployment.yaml, install.sh."

          - name: language
            label: Language / Format
            type: string
            description: "EXAMPLE: Terraform / HCL, Bash, YAML, Python, Dockerfile."

          - name: code
            label: Code
            type: text
            description: "Paste the complete code or configuration here."


      # ========================================================================
      # K. DOWNLOADABLE FILES
      # ========================================================================

      - name: downloads
        label: Downloadable Files
        type: object
        description: "WHAT THIS DOES: Adds files visitors can download. EXAMPLE: lab ZIP, Terraform module, PDF certificate, YAML configuration, Bash script. READER SEES: Could appear as Download buttons/cards at the bottom of the article."

        list:
          collapsible:
            collapsed: true
            summary: "{label}"

        fields:
          - name: label
            label: Display Name
            type: string
            description: "EXAMPLE: Download Terraform VPC Lab."

          - name: file
            label: File
            type: file
            description: "Select or upload the actual file visitors should receive."

            options:
              path: images/downloads
              extensions:
                - pdf
                - zip
                - yaml
                - yml
                - json
                - tf
                - sh
                - py
              rename: safe

          - name: description
            label: Short Description
            type: string
            description: "EXAMPLE: Full Terraform configuration used in this lab."


      # ========================================================================
      # L. REFERENCES & LINKS
      # ========================================================================

      - name: external_links
        label: References & Links
        type: object
        description: "WHAT THIS DOES: Stores external resources used by or related to the article. EXAMPLE: GitHub repository, Cisco documentation, Terraform docs, AWS docs, Coursera certificate. READER SEES: Could appear in a References / Resources section at the bottom."

        list:
          collapsible:
            collapsed: true
            summary: "{text}"

        fields:
          - name: text
            label: Link Text
            type: string
            description: "EXAMPLE: Terraform AWS Provider Documentation."

          - name: url
            label: URL
            type: string
            description: "Paste the full destination URL."

          - name: open_in_new_tab
            label: Open in New Tab
            type: boolean
            default: true
            description: "ON means visitors stay on your site while the external resource opens in another browser tab."


      # ========================================================================
      # M. SEO & SOCIAL SHARING
      # ========================================================================

      - name: seo
        label: SEO & Social Cards
        type: object
        description: "WHAT THIS DOES: Controls how search engines and social platforms understand the article. EXAMPLE: Custom Google description or custom image when the article is shared. READER SEES: Usually invisible on the article itself; search engines, browsers and social apps use this metadata."

        fields:
          - name: meta_title
            label: SEO Title
            type: string
            description: "WHAT THIS DOES: Optional title specifically for search engines/browser metadata. EXAMPLE: Building an AWS VPC with Terraform | WVRNER. Usually keep it below roughly 60 characters."

          - name: meta_description
            label: Meta Description
            type: text
            description: "WHAT THIS DOES: Search-engine summary. EXAMPLE: Learn how I built a reproducible AWS VPC using Terraform and tested infrastructure drift. Aim for around 150-160 characters."

          - name: og_image
            label: Social Share Image
            type: image
            description: "WHAT THIS DOES: Image used when someone shares the article on social platforms/chat apps. Recommended size: 1200x630."

            options:
              path: images/posts
              extensions:
                - png
                - jpg
                - webp
              rename: safe

          - name: canonical_url
            label: Canonical URL
            type: string
            description: "WHAT THIS DOES: Tells search engines the original source if this article was first published somewhere else. EXAMPLE: If originally published on Medium, put that original URL here. Normally leave this blank for articles originally published on wvrner.com."

          - name: no_index
            label: Hide From Search Engines
            type: boolean
            default: false
            description: "WHAT THIS DOES: Requests that search engines do not index this article. EXAMPLE: Use for a temporary/private-ish public test article. Normally leave OFF."


      # ========================================================================
      # N. PUBLISHING CONTROLS
      # ========================================================================

      - name: published
        label: Published
        type: boolean
        default: true
        description: "WHAT THIS DOES: Controls whether Eleventy includes the article in your public blog collection. ON = public article. OFF = draft. READER SEES: OFF articles should not appear on the blog because .eleventy.js filters published: false."


      - name: featured
        label: Featured Post
        type: boolean
        default: false
        description: "WHAT THIS DOES: Marks an article as especially important. EXAMPLE: Your best infrastructure project or certification write-up. READER SEES: Currently nothing unless blog.njk/post.njk is later configured to give featured articles special placement."


      - name: layout
        label: Layout Template
        type: string
        default: post.njk
        hidden: true
        description: "INTERNAL: Tells Eleventy which template should render the post. Normally do not change this."
