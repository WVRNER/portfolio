# ==============================================================================
# .pages.yml  (rename this file to ".pages.yml" in the repo root)
# Pages CMS config for Nima Hosseini (@wvrner) - DevOps & Infrastructure Portfolio
# Docs: https://pagescms.org/docs/configuration/
#
# QUICK GUIDE: HOW TO EDIT THIS FILE LATER
#   * Add a dropdown option  -> add a line under that field's `values:` list
#   * Add a new field        -> copy any block under `fields:` and change `name`
#                               (the name becomes the frontmatter key your
#                               template reads, e.g. {{ series.name }})
#   * Hide a field           -> add `hidden: true`
#   * Make a field optional  -> remove `required: true`
#   * Indentation is 2 spaces. Never use tabs. Quote any value that contains
#     a colon (:), a hash (#), or starts with a special character.
#   * A field the template doesn't render still saves fine, it just does nothing.
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. MEDIA (uploads)
# ------------------------------------------------------------------------------
media:
  input: images          # folder in the repo where files are stored
  output: /images        # public URL prefix written into posts
  categories:            # allowed groups of file types
    - image
    - document
    - compressed
    - code
  extensions:            # extra individual extensions allowed
    - png
    - jpg
    - jpeg
    - webp
    - svg
    - gif
    - avif
    - pdf
    - zip
    - yaml
    - yml
    - json
    - tf
    - sh
    - py
  rename: safe           # slugifies filenames: "My Lab (1).PNG" -> "my-lab-1.png"
  # WARNING: the repo is public. Never upload files containing keys, tokens,
  # account IDs, or internal IPs (check .tf, .sh, .py, .json and screenshots).


# ------------------------------------------------------------------------------
# 2. CONTENT
# ------------------------------------------------------------------------------
content:
  - name: posts
    label: Blog Posts
    type: collection
    path: posts
    filename: "{fields.slug}.md"   # new post "my-lab" -> posts/my-lab.md
    description: "Engineering notes, lab logs, architecture write-ups, certifications"

    # Dashboard table
    view:
      fields: [title, category, date, updated, published, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title, subtitle, excerpt, category, post_tags]

    fields:

      # ------------------------------------------------------------------------
      # A. IDENTITY
      # ------------------------------------------------------------------------
      - name: title
        label: Post Title
        type: string
        required: true
        description: "Main headline. Example: Building a Zero-Drift VPC with Terraform"

      - name: slug
        label: URL Slug (also the filename)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"   # lowercase letters, numbers, hyphens only
        description: "Example: terraform-zero-drift-vpc  ->  posts/terraform-zero-drift-vpc.md. Do not change after publishing (breaks links)."

      - name: subtitle
        label: Subtitle / Hook
        type: string
        required: true
        description: "One-line hook under the title. Example: How I replaced click-ops with a reproducible AWS network."

      - name: excerpt
        label: Blog Feed Teaser
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 300
        description: "2-3 sentences shown on the /blog feed card. Example: I rebuilt my lab VPC from scratch in Terraform, then broke it on purpose to test drift detection."

      - name: author
        label: Author
        type: string
        default: "Nima Hosseini"

      - name: category
        label: Category Badge
        type: select
        required: true
        description: "Pick ONE. To add a category: copy a `- value:` pair below and edit both lines."
        options:
          values:
            - value: "CERTIFICATION & LAB LOG"
              label: "Certification & Lab Log"
            - value: "DEVOPS & INFRASTRUCTURE"
              label: "DevOps & Infrastructure"
            - value: "CLOUD ARCHITECTURE & AWS"
              label: "Cloud Architecture & AWS"
            - value: "LINUX & KERNEL SYSTEMS"
              label: "Linux & Kernel Systems"
            - value: "ENTERPRISE NETWORKING"
              label: "Enterprise Networking"
            - value: "CI/CD & AUTOMATION"
              label: "CI/CD & Automation"
            - value: "KUBERNETES & CONTAINERS"
              label: "Kubernetes & Containers"
            - value: "DEVSECOPS & OBSERVABILITY"
              label: "DevSecOps & Observability"
            - value: "INFRASTRUCTURE AS CODE"
              label: "Infrastructure as Code"
            - value: "SOFTWARE ENGINEERING"
              label: "Software Engineering"
            - value: "PROJECT BUILD LOG"
              label: "Project Build Log"
            - value: "CAREER & LEARNING"
              label: "Career & Learning"

      # ------------------------------------------------------------------------
      # B. DATES & READING TIME
      # ------------------------------------------------------------------------
      - name: date
        label: Publication Date
        type: date
        required: true
        default: now
        description: "Used for sorting. Set a past date to backdate a post."

      - name: display_date
        label: Display Date (text)
        type: string
        required: true
        description: "Human text shown on the post. Example: October 2026. Keep it in sync with the date above."

      - name: updated
        label: Last Updated
        type: date
        description: "Optional. Fill in when you revise an older post. Template can show 'Updated: ...' if this exists."

      - name: read_time
        label: Reading Time
        type: string
        required: true
        description: "Example: 6 min read  |  12 min deep dive. Rule of thumb: words / 200."

      # ------------------------------------------------------------------------
      # C. COVER IMAGE
      # ------------------------------------------------------------------------
      - name: cover_image
        label: Cover Image
        type: image
        description: "Header banner, feed thumbnail. Recommended 1600x900."
        options:
          path: images/posts
          extensions: [png, jpg, jpeg, webp, svg]
          rename: safe

      - name: cover_image_alt
        label: Cover Alt Text
        type: string
        description: "Describe the image for screen readers. Example: Diagram of a three-tier AWS VPC with public and private subnets."

      - name: cover_image_caption
        label: Cover Caption / Credit
        type: string
        description: "Optional. Example: Architecture drawn in draw.io"

      # ------------------------------------------------------------------------
      # D. TAGS
      # ------------------------------------------------------------------------
      - name: post_tags
        label: Topic Tags
        type: select
        required: true
        description: "Choose 1-12. To add a tag: add a quoted line like - \"#Ansible\" under values."
        options:
          multiple: true
          min: 1
          max: 12
          values:
            - "#DevOps"
            - "#IBMCloud"
            - "#Coursera"
            - "#Docker"
            - "#Kubernetes"
            - "#OpenShift"
            - "#CICD"
            - "#GitHubActions"
            - "#Jenkins"
            - "#Tekton"
            - "#GitOps"
            - "#Terraform"
            - "#Ansible"
            - "#AWS"
            - "#Cloudflare"
            - "#GitHubPages"
            - "#ZeroDrift"
            - "#Linux"
            - "#Bash"
            - "#Python"
            - "#PythonFlask"
            - "#TDD"
            - "#Networking"
            - "#CCNA"
            - "#MCSA"
            - "#MikroTik"
            - "#Virtualization"
            - "#Security"
            - "#Prometheus"
            - "#Grafana"
            - "#OpenSource"
            - "#Neubrutalism"
            - "#CareerNotes"

      # ------------------------------------------------------------------------
      # E. SERIES, RELATED POSTS, TABLE OF CONTENTS
      # ------------------------------------------------------------------------
      - name: series
        label: Series
        type: object
        description: "Optional. Group multi-part posts. Example: name = Terraform Lab Series, part = 2"
        fields:
          - name: name
            label: Series Name
            type: string
          - name: part
            label: Part Number
            type: number

      - name: related_posts
        label: Related Posts
        type: reference
        description: "Optional. Pick other posts to link at the bottom. Stores their slugs."
        options:
          collection: posts
          multiple: true
          search: title
          value: "{fields.slug}"
          label: "{fields.title}"

      - name: toc
        label: Show Table of Contents
        type: boolean
        default: false
        description: "Turn on for long posts with several H2/H3 sections."

      # ------------------------------------------------------------------------
      # F. CALLOUT BOX  (OFF by default; empty defaults so nothing leaks into new posts)
      # ------------------------------------------------------------------------
      - name: callout_box
        label: Highlighted Callout Box
        type: object
        description: "Optional highlighted card. Leave 'Show' off to skip it."
        fields:
          - name: enable
            label: Show Callout Box
            type: boolean
            default: false

          - name: tag_label
            label: Monospace Label
            type: string
            description: "Examples: // Program Blueprint  |  // Architecture Note  |  // Warning"

          - name: title
            label: Box Title
            type: string
            description: "Example: IBM DevOps and Software Engineering Professional Certificate"

          - name: content
            label: Box Text
            type: text
            description: "2-4 sentences. Example: Ten-course program covering CI/CD, containers, Kubernetes and TDD."

          - name: link_text
            label: Link Text
            type: string
            description: "Example: Explore the full curriculum on Coursera →   (use the → character, not &rarr;)"

          - name: link_url
            label: Link URL
            type: string
            description: "Full URL starting with https://"

      # ------------------------------------------------------------------------
      # G. ARTICLE BODY
      # ------------------------------------------------------------------------
      - name: body
        label: Article Content
        type: rich-text
        required: true
        description: "Write normally. Code: use a code block and name the language so highlighting works. Images: use the picture button; they upload to images/posts."
        options:
          format: markdown       # change to `html` ONLY if your build expects raw HTML bodies
          path: images/posts
          extensions: [png, jpg, jpeg, webp, svg, gif]
          rename: safe

      # ------------------------------------------------------------------------
      # H. STANDALONE CODE SNIPPETS (separate from the body)
      # ------------------------------------------------------------------------
      - name: code_snippets
        label: Config / Code Snippets
        type: object
        list: true
        description: "Optional. Use for files readers might copy whole (main.tf, Dockerfile). For short inline examples, use a code block in the body instead."
        fields:
          - name: file_name
            label: File Name
            type: string
            description: "Examples: main.tf, Dockerfile, ingress.yaml, deploy.sh"
          - name: language
            label: Language
            type: select
            default: "yaml"
            options:
              values:
                - "bash"
                - "python"
                - "yaml"
                - "dockerfile"
                - "hcl"
                - "json"
                - "ini"
                - "sql"
                - "html"
                - "css"
                - "javascript"
          - name: code
            label: Code
            type: code

      # ------------------------------------------------------------------------
      # I. DOWNLOADS
      # ------------------------------------------------------------------------
      - name: downloads
        label: Downloadable Files
        type: object
        list: true
        description: "Optional. Public repo: only attach files that are safe for anyone to read."
        fields:
          - name: label
            label: Display Name
            type: string
            description: "Examples: Course Syllabus PDF, Terraform VPC module (.zip)"
          - name: file
            label: File
            type: file
            options:
              path: images/downloads
              extensions: [pdf, zip, yaml, yml, json, tf, sh, py]
              rename: safe
          - name: description
            label: Short Note
            type: string
            description: "Example: Verified certificate, 2.4 MB"

      # ------------------------------------------------------------------------
      # J. EXTERNAL LINKS
      # ------------------------------------------------------------------------
      - name: external_links
        label: References & Links
        type: object
        list: true
        description: "Optional. Docs, repos, verified credentials."
        fields:
          - name: text
            label: Link Text
            type: string
            description: "Examples: Terraform AWS provider docs, Source repo on GitHub"
          - name: url
            label: URL
            type: string
          - name: open_in_new_tab
            label: Open in New Tab
            type: boolean
            default: true

      # ------------------------------------------------------------------------
      # K. SEO & SOCIAL CARDS
      # ------------------------------------------------------------------------
      - name: seo
        label: SEO & Social Cards
        type: object
        description: "Optional. Leave blank to let the template fall back to title/excerpt."
        fields:
          - name: meta_title
            label: SEO Title
            type: string
            description: "Under 60 characters. Overrides the browser tab title."
          - name: meta_description
            label: Meta Description
            type: text
            description: "150-160 characters for Google snippets."
          - name: og_image
            label: Share Card Image (1200x630)
            type: image
            options:
              path: images/posts
              extensions: [png, jpg, webp]
              rename: safe
          - name: canonical_url
            label: Canonical URL
            type: string
            description: "Only if this was first published elsewhere (Medium, Substack, dev.to)."
          - name: no_index
            label: Hide from Search Engines
            type: boolean
            default: false

      # ------------------------------------------------------------------------
      # L. PUBLISHING CONTROLS
      # ------------------------------------------------------------------------
      - name: published
        label: Published
        type: boolean
        default: true
        description: "Turn OFF to keep a draft. Your template/build must skip posts where published is false."

      - name: featured
        label: Pin as Featured
        type: boolean
        default: false

      - name: layout
        label: Layout Template
        type: string
        default: post.njk
        hidden: true


