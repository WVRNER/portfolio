<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nima Hosseini</title>
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Nunito:wght@400;600;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-center:#F2F2F4;
    --bg-edge:#E2E2E6;
    --ink:#010c14;
    --radius:0px;           /* TEST: corners sharp (0px). REVERSIBLE: set to 28px to restore rounded corner */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-edge);font-family:"Nunito",system-ui,sans-serif}

  /* ---------- the section ---------- */
  .wv-hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    border-radius:0;   /* TEST: sharp corners. REVERSIBLE: set to var(--radius) 0 var(--radius) 0 */
    overflow:hidden;
    background:var(--bg-edge);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* WebGL layer that draws the two corner pools */
  .wv-hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .wv-mark{
    position:relative;
    font-family:"Inter Tight",system-ui,sans-serif;
    font-weight:900;
    font-size:clamp(40px,11.5vw,220px);
    line-height:.9;
    letter-spacing:-.03em;
    white-space:nowrap;
    color:#010c14;
  }
  .wv-lines{position:relative;margin-top:clamp(36px,6vh,72px);text-align:center}
  .wv-l1, .wv-l2{font-size:18px;font-weight:400;color:#5E5E66;line-height:1.35}
  .wv-l2{margin-top:4px}
  .wv-l3{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:#9A9AA3;margin-top:28px}
  .wv-num{font-variant-numeric:tabular-nums;display:inline-block;min-width:3ch}
  @media (max-width:600px){
    .wv-lines{padding:0 12vw}
    .wv-l1, .wv-l2{font-size:15px}.wv-l3{font-size:9.5px}
  }

  /* Tagline entrance animation */
  html.js .wv-word{
    display:inline-block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(0.25em);
    transition:opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
               filter 0.7s cubic-bezier(0.22, 1, 0.36, 1),
               transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  html.js .wv-word.is-visible{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
  html.js .wv-l2{
    opacity:0;
    filter:blur(4px);
    transform:translateY(0.25em);
    transition:opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
               filter 0.9s cubic-bezier(0.22, 1, 0.36, 1),
               transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  }
  html.js .wv-l2.is-visible{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
  html.js .wv-l3{
    opacity:0;
    transition:opacity 0.6s ease-out;
  }
  html.js .wv-l3.is-visible{
    opacity:1;
  }

  @media (prefers-reduced-motion: reduce){
    html.js .wv-word,
    html.js .wv-l2,
    html.js .wv-l3{
      opacity:1 !important;
      filter:none !important;
      transform:none !important;
      transition:none !important;
    }
  }
</style>
</head>
<body>

<section class="wv-hero" id="wv-hero">
  <canvas id="wv-pools" aria-hidden="true"></canvas>
  <h1 class="wv-mark">Nima Hosseini</h1>
  <div class="wv-lines">
    <p class="wv-l1" id="tagline-l1" aria-label="you didn't notice anything,">you didn't notice anything,</p>
    <p class="wv-l2" id="tagline-l2">that was the job.</p>
    <p class="wv-l3" id="tagline-l3">THIS PAGE REACHED YOU IN <span class="wv-num" id="count-num">997</span> MS FROM FRA</p>
  </div>
</section>

<script>
(() => {
  const section = document.getElementById('wv-hero');
  const canvas  = document.getElementById('wv-pools');
  const gl = canvas.getContext('webgl', {premultipliedAlpha:true, antialias:false, alpha:true});
  if (!gl) return;                       // no WebGL: page still works, just no pools

  const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

  /* Fragment shader: for every pixel, how deep is it inside the section
     (distance from the rounded edge), and how thick is the pool here?
     black  = inside the pool
     inner fringe (black -> indigo -> blue -> cyan -> ice -> fade) faces the center
     rim fringe   (coral/red -> magenta -> pink -> violet -> black) sits on the section edge */
  const FRAG = `
  precision highp float;
  uniform vec2  uRes;     // canvas size in px
  uniform float uDpr;
  uniform float uRad;     // corner radius (css px)
  uniform float uTime;

  // rounded-rectangle signed distance (negative inside)
  float sdRoundRect(vec2 p, vec2 b, float r){
    vec2 q = abs(p) - b + r;
    return length(max(q,0.)) + min(max(q.x,q.y),0.) - r;
  }

  vec3 grad(float t, vec3 a, vec3 b, vec3 c, vec3 d, vec3 e, vec3 f){
    t = clamp(t,0.,1.)*5.;
    if(t<1.) return mix(a,b,t);
    if(t<2.) return mix(b,c,t-1.);
    if(t<3.) return mix(c,d,t-2.);
    if(t<4.) return mix(d,e,t-3.);
    return mix(e,f,t-4.);
  }
  vec3 hex(float r,float g,float b){ return vec3(r,g,b)/255.; }

  // thickness of one corner pool at point p (css px), corner at c, phase ph
  // every motion uses whole-number multiples of LOOP, so the last frame meets the first (seamless)
  const float LOOP = 10.0;                                  // seconds per loop
  float pool(vec2 p, vec2 c, vec2 S, float t, float ph){
    float w = 6.2831853 / LOOP;
    float breathe = 1. + 0.28*sin(w*t + ph);                // swell / shrink
    float spread  = 1. + 0.14*sin(w*t + ph + 1.2);          // creep along the edges
    vec2  L = vec2(max(0.30*S.x, 0.42*min(S.x, S.y)), min(0.42*S.y, 0.54*S.x)) * spread;
    vec2  d = (p - c) / L;
    float r2 = dot(d,d);
    // slow liquid wobble (continuous, no angle seams)
    float s = (abs(p.x-c.x) - abs(p.y-c.y)) * 0.012;
    float wob = 1. + 0.13*sin(s*1.1 - 2.*w*t + ph) + 0.05*sin(s*2.3 + 3.*w*t);   // wave travelling along the edge
    float minDim = min(S.x, S.y);
    float Tmax = clamp(0.135*minDim + (S.y > S.x ? 18. : 0.), 48., 145.);
    return Tmax * breathe * wob * exp(-r2*1.85);
  }

  void main(){
    vec2 S  = uRes / uDpr;                          // size in css px
    vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;   // top-left origin
    float edge  = -sdRoundRect(px - S*0.5, S*0.5, uRad);              // distance from the rounded rim
    // pool boundary is measured from a much rounder rectangle, so the inner edge
    // sweeps round the corner instead of pinching into a sharp notch
    float bigR  = 0.28*min(S.x,S.y);
    float depth = -sdRoundRect(px - S*0.5, S*0.5, bigR);

    float t = uTime;
    // two pools: top-right and bottom-left corners
    float T = max(pool(px, vec2(S.x, 0.), S, t, 0.), pool(px, vec2(0., S.y), S, t, 3.14159));  // opposite phases
    vec3 ink = hex(1.,12.,20.); // #010c14

    // TEST: Sharp corners & removed red gradient.
    // REVERSIBLE NOTE: To restore original pool:
    // 1) Restore if(edge < 0.) red rim glow with mix(hex(255.,45.,61.), hex(255.,106.,61.), g)
    // 2) Restore rimCol gradient
    // 3) Restore col = (edge < rimW) ? rimCol : ink
    if(edge < 0.){ gl_FragColor = vec4(0.); return; }
    if(T < 0.5){ gl_FragColor = vec4(0.); return; }

    // ---- inner fringe: just past the pool edge, toward the center ----
    float fw = clamp(T*0.55, 10., 46.);             // fringe width scales with pool thickness
    float x  = (depth - T) / fw;                    // 0 at pool edge -> 1 fade out
    vec3 inCol = grad(x,
      hex(26.,18.,64.),     // indigo
      hex(47.,75.,255.),    // electric blue
      hex(30.,139.,255.),   // azure
      hex(0.,200.,255.),    // cyan
      hex(127.,243.,255.),  // ice
      hex(255.,255.,255.)); // white -> fades into bg

    vec3 col;
    float alpha;
    if(depth <= T){
      col   = ink; // Sharp solid core, no red gradient
      alpha = 1.;
      // soften very thin parts of the pool so its ends melt away
      alpha *= smoothstep(0.5, 6., T);
    } else {
      col   = inCol;
      float fade = 1. - smoothstep(0.55, 1.0, x);
      alpha = fade * smoothstep(2., 14., T);         // fringe fades where the pool thins
    }
    gl_FragColor = vec4(col*alpha, alpha);
  }`;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes=U('uRes'), uDpr=U('uDpr'), uRad=U('uRad'), uTime=U('uTime');
  const radius = parseFloat(getComputedStyle(section).borderTopLeftRadius) || 0;

  let dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = section.getBoundingClientRect();
    canvas.width  = Math.round(r.width  * dpr);
    canvas.height = Math.round(r.height * dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  function draw(t){
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uDpr, dpr);
    gl.uniform1f(uRad, radius);
    gl.uniform1f(uTime, t);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  new ResizeObserver(() => { resize(); if(still) draw(0); }).observe(section);
  resize();
  if(still){ draw(0); }
  else {
    const fixed = new URLSearchParams(location.search).get('t');   // ?t=3 freezes the loop at 3s (handy for screenshots)
    if(fixed !== null){ draw(parseFloat(fixed)); }
    else {
      const t0 = performance.now();
      (function loop(){ draw((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
    }
  }

  // Tagline Entrance Animation
  (async function initTagline() {
    const l1 = document.getElementById('tagline-l1');
    const l2 = document.getElementById('tagline-l2');
    const l3 = document.getElementById('tagline-l3');
    const numEl = document.getElementById('count-num');
    if (!l1 || !l2 || !l3 || !numEl) return;

    if (still) {
      numEl.textContent = '997';
      return;
    }

    const originalText = l1.textContent.trim();
    const words = originalText.split(/\s+/);
    l1.innerHTML = words
      .map((word, i) => `<span class="wv-word">${word}</span>${i < words.length - 1 ? ' ' : ''}`)
      .join('');

    numEl.textContent = '0';

    if (document.fonts) {
      await document.fonts.ready;
    }

    const wordSpans = l1.querySelectorAll('.wv-word');

    // 1. t = 0.15s: Line 1 appears word by word (0.7s per word, 0.06s stagger)
    wordSpans.forEach((span, i) => {
      setTimeout(() => {
        span.classList.add('is-visible');
      }, 150 + i * 60);
    });

    // 2. Pause about 0.35s after last word of line 1 starts
    const lastWordStartTime = 150 + Math.max(0, words.length - 1) * 60;
    const line2StartTime = lastWordStartTime + 350;

    // 3. Line 2 appears as one unit (slower 0.9s, smaller blur 4px)
    setTimeout(() => {
      l2.classList.add('is-visible');
    }, line2StartTime);

    // 4. 0.2s after line 2 starts: line 3 fades in (0.6s) and number counts up from 0 to 997 over 1.0s
    const line3StartTime = line2StartTime + 200;
    setTimeout(() => {
      l3.classList.add('is-visible');

      const duration = 1000;
      const target = 997;
      const countStart = performance.now();

      function countStep(now) {
        const elapsed = now - countStart;
        const progress = Math.min(1, elapsed / duration);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(easeOut * target);
        numEl.textContent = String(current);

        if (progress < 1) {
          requestAnimationFrame(countStep);
        } else {
          numEl.textContent = '997';
        }
      }
      requestAnimationFrame(countStep);
    }, line3StartTime);
  })();
})();
</script>
</body>
</html>
