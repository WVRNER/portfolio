<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nima Hosseini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Nunito:wght@400;600;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-center:#F2F2F4;
    --bg-edge:#E2E2E6;
    --ink:#050c1a;
    --radius:28px;           /* section corner radius (also used by the shader) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-edge);font-family:"Nunito",system-ui,sans-serif}

  /* ---------- the section ---------- */
  .wv-hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    border-radius:var(--radius) 0 var(--radius) 0;   /* TL TR BR BL: square where the pools sit, the shader rounds them */
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 48%, var(--bg-center) 0%, var(--bg-edge) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* faint ripple rings */
  .wv-hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-radial-gradient(circle at 50% 46%,
      transparent 0 96px, rgba(0,0,0,.016) 97px 98.5px, transparent 100px 190px);
    -webkit-mask:radial-gradient(circle at 50% 46%, #000 0 55%, transparent 80%);
            mask:radial-gradient(circle at 50% 46%, #000 0 55%, transparent 80%);
  }
  /* WebGL layer that draws the two corner pools */
  .wv-hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .wv-mark{
    position:relative;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(40px,11.5vw,220px);
    line-height:.9;
    letter-spacing:-.03em;
    white-space:nowrap;
    color:#050c1a;
  }
  .wv-lines{position:relative;margin-top:clamp(36px,6vh,72px);text-align:center}
  .wv-l1{font-size:18px;font-weight:400;color:#5E5E66}
  .wv-phrase{
    display:inline-block;
    opacity:0;
    transform:translateY(6px);
    animation:wvFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .wv-phrase-1{
    animation-delay:0.3s;
    margin-right:0.3em;
  }
  .wv-phrase-2{
    animation-delay:1.5s;
  }
  @keyframes wvFadeIn{
    to{
      opacity:1;
      transform:translateY(0);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .wv-phrase{
      opacity:1;
      transform:none;
      animation:none;
    }
  }
  .wv-l3{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:#9A9AA3;margin-top:28px}
  @media (max-width:600px){
    .wv-lines{padding:0 12vw}
    .wv-l1{font-size:15px}.wv-l3{font-size:9.5px}
  }
</style>
</head>
<body>

<section class="wv-hero" id="wv-hero">
  <canvas id="wv-pools" aria-hidden="true"></canvas>
  <h1 class="wv-mark">Nima Hosseini</h1>
  <div class="wv-lines">
    <p class="wv-l1">
      <span class="wv-phrase wv-phrase-1">you didn't notice anything.</span>
      <span class="wv-phrase wv-phrase-2">that was the job.</span>
    </p>
    <p class="wv-l3">THIS PAGE REACHED YOU IN 997 MS FROM FRA</p>
  </div>
</section>

<script>
(() => {
  const section = document.getElementById('wv-hero');
  const canvas  = document.getElementById('wv-pools');
  const gl = canvas.getContext('webgl', {premultipliedAlpha:true, antialias:false, alpha:true});
  if (!gl) return;                       // no WebGL: page still works, just no pools

  const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

  /* Fragment shader: for every pixel, how deep is it inside the section
     (distance from the rounded edge), and how thick is the pool here?
     black  = inside the pool
     inner fringe (black -> indigo -> blue -> cyan -> ice -> fade) faces the center
     rim fringe   (coral/red -> magenta -> pink -> violet -> black) sits on the section edge */
  const FRAG = `
  precision highp float;
  uniform vec2  uRes;     // canvas size in px
  uniform float uDpr;
  uniform float uRad;     // corner radius (css px)
  uniform float uTime;

  // rounded-rectangle signed distance (negative inside)
  float sdRoundRect(vec2 p, vec2 b, float r){
    vec2 q = abs(p) - b + r;
    return length(max(q,0.)) + min(max(q.x,q.y),0.) - r;
  }

  vec3 grad(float t, vec3 a, vec3 b, vec3 c, vec3 d, vec3 e, vec3 f){
    t = clamp(t,0.,1.)*5.;
    if(t<1.) return mix(a,b,t);
    if(t<2.) return mix(b,c,t-1.);
    if(t<3.) return mix(c,d,t-2.);
    if(t<4.) return mix(d,e,t-3.);
    return mix(e,f,t-4.);
  }
  vec3 hex(float r,float g,float b){ return vec3(r,g,b)/255.; }

  // thickness of one corner pool at point p (css px), corner at c, phase ph
  // every motion uses whole-number multiples of LOOP, so the last frame meets the first (seamless)
  const float LOOP = 10.0;                                  // seconds per loop
  float pool(vec2 p, vec2 c, vec2 S, float t, float ph){
    float w = 6.2831853 / LOOP;
    float breathe = 1. + 0.28*sin(w*t + ph);                // swell / shrink
    float spread  = 1. + 0.14*sin(w*t + ph + 1.2);          // creep along the edges
    vec2  L = vec2(0.30*S.x, min(0.42*S.y, 0.54*S.x)) * spread;
    vec2  d = (p - c) / L;
    float r2 = dot(d,d);
    // slow liquid wobble (continuous, no angle seams)
    float s = (abs(p.x-c.x) - abs(p.y-c.y)) * 0.012;
    float wob = 1. + 0.13*sin(s*1.1 - 2.*w*t + ph) + 0.05*sin(s*2.3 + 3.*w*t);   // wave travelling along the edge
    float Tmax = clamp(0.135*min(S.x,S.y), 48., 145.);
    return Tmax * breathe * wob * exp(-r2*1.85);
  }

  void main(){
    vec2 S  = uRes / uDpr;                          // size in css px
    vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;   // top-left origin
    float edge  = -sdRoundRect(px - S*0.5, S*0.5, uRad);              // distance from the rounded rim
    // pool boundary is measured from a much rounder rectangle, so the inner edge
    // sweeps round the corner instead of pinching into a sharp notch
    float bigR  = 0.28*min(S.x,S.y);
    float depth = -sdRoundRect(px - S*0.5, S*0.5, bigR);

    float t = uTime;
    // two pools: top-right and bottom-left corners
    float T = max(pool(px, vec2(S.x, 0.), S, t, 0.), pool(px, vec2(0., S.y), S, t, 3.14159));  // opposite phases
    vec3 ink = hex(5.,12.,26.);

    // the tip of the square corner, outside the rounded rim: fill it with the rim's glow
    if(edge < 0.){
      float g = smoothstep(0., 14., -edge);                 // 0 at the rim -> 1 at the very tip
      vec3  c = mix(hex(255.,45.,61.), hex(255.,106.,61.), g);
      float a = (1. - g*0.85) * smoothstep(3., 10., T);
      gl_FragColor = vec4(c*a, a); return;
    }
    if(T < 0.5){ gl_FragColor = vec4(0.); return; }

    // ---- rim fringe: on the section edge, inside the pool ----
    float rimW = clamp(T*0.22, 3., 16.);
    float rimT = edge / rimW;                       // 0 at edge -> 1 into black
    vec3 rimCol = grad(rimT,
      hex(255.,106.,61.),   // coral
      hex(255.,45.,61.),    // red
      hex(255.,31.,122.),   // magenta-rose
      hex(255.,79.,176.),   // hot pink
      hex(42.,31.,168.),    // violet-blue
      ink);

    // ---- inner fringe: just past the pool edge, toward the center ----
    float fw = clamp(T*0.55, 10., 46.);             // fringe width scales with pool thickness
    float x  = (depth - T) / fw;                    // 0 at pool edge -> 1 fade out
    vec3 inCol = grad(x,
      hex(26.,18.,64.),     // indigo
      hex(47.,75.,255.),    // electric blue
      hex(30.,139.,255.),   // azure
      hex(0.,200.,255.),    // cyan
      hex(127.,243.,255.),  // ice
      hex(255.,255.,255.)); // white -> fades into bg

    vec3 col;
    float alpha;
    if(depth <= T){
      col   = (edge < rimW) ? rimCol : ink;
      alpha = 1.;
      // soften very thin parts of the pool so its ends melt away
      alpha *= smoothstep(0.5, 6., T);
    } else {
      col   = inCol;
      float fade = 1. - smoothstep(0.55, 1.0, x);
      alpha = fade * smoothstep(2., 14., T);         // fringe fades where the pool thins
    }
    gl_FragColor = vec4(col*alpha, alpha);
  }`;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes=U('uRes'), uDpr=U('uDpr'), uRad=U('uRad'), uTime=U('uTime');
  const radius = parseFloat(getComputedStyle(section).borderTopLeftRadius) || 0;

  let dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = section.getBoundingClientRect();
    canvas.width  = Math.round(r.width  * dpr);
    canvas.height = Math.round(r.height * dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  function draw(t){
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uDpr, dpr);
    gl.uniform1f(uRad, radius);
    gl.uniform1f(uTime, t);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  new ResizeObserver(() => { resize(); if(still) draw(0); }).observe(section);
  resize();
  if(still){ draw(0); return; }
  const fixed = new URLSearchParams(location.search).get('t');   // ?t=3 freezes the loop at 3s (handy for screenshots)
  if(fixed !== null){ draw(parseFloat(fixed)); return; }
  const t0 = performance.now();
  (function loop(){ draw((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
