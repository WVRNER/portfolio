<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nima Hosseini</title>
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Nunito:wght@400;600;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-edge:#E2E2E6;
    --ink:#050c1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-edge);font-family:"Nunito",system-ui,sans-serif}

  /* ---------- the section (sharp corners, no light circle) ---------- */
  .wv-hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    border-radius:0;
    overflow:hidden;
    background:var(--bg-edge);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* WebGL layer that draws the two corner pools */
  .wv-hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .wv-mark{
    position:relative;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(40px,11.5vw,220px);
    line-height:.9;
    letter-spacing:-.03em;
    white-space:nowrap;
    color:#050c1a;
  }
  .wv-lines{position:relative;margin-top:clamp(36px,6vh,72px);text-align:center}
  .wv-l1, .wv-l2{
    font-size:18px;
    font-weight:400;
    color:#5E5E66;
    line-height:1.4;
  }
  .wv-l2{
    margin-top:4px;
  }
  .wv-l3{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:#9A9AA3;
    margin-top:28px;
    font-variant-numeric:tabular-nums;
  }
  .wv-num{
    font-variant-numeric:tabular-nums;
    display:inline-block;
  }

  /* Hide before JS runs to prevent flash */
  html.js .wv-l1-text,
  html.js .wv-l2,
  html.js .wv-l3{
    opacity:0;
  }

  /* Entrance animation styles */
  .wv-word{
    display:inline-block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(0.25em);
    transition:opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
               filter 0.7s cubic-bezier(0.22, 1, 0.36, 1),
               transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    will-change:opacity, filter, transform;
  }
  .wv-l2{
    opacity:0;
    filter:blur(4px);
    transform:translateY(0.25em);
    transition:opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
               filter 0.9s cubic-bezier(0.22, 1, 0.36, 1),
               transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    will-change:opacity, filter, transform;
  }
  .wv-l3{
    opacity:0;
    transition:opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    will-change:opacity;
  }

  /* Animated state */
  .wv-animate .wv-word{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
  .wv-animate .wv-l2{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
  .wv-animate .wv-l3{
    opacity:1;
  }

  @media (prefers-reduced-motion: reduce){
    html.js .wv-l1-text,
    html.js .wv-l2,
    html.js .wv-l3,
    .wv-word,
    .wv-l2,
    .wv-l3{
      opacity:1 !important;
      filter:none !important;
      transform:none !important;
      transition:none !important;
    }
  }

  @media (max-width:600px){
    .wv-lines{padding:0 12vw}
    .wv-l1, .wv-l2{font-size:15px}
    .wv-l3{font-size:9.5px}
  }
</style>
</head>
<body>

<section class="wv-hero" id="wv-hero">
  <canvas id="wv-pools" aria-hidden="true"></canvas>
  <h1 class="wv-mark">Nima Hosseini</h1>
  <div class="wv-lines">
    <p class="wv-l1" aria-label="you didn't notice anything,">
      <span class="wv-l1-text">you didn't notice anything,</span>
    </p>
    <p class="wv-l2" aria-label="that was the job.">
      <span class="wv-l2-text">that was the job.</span>
    </p>
    <p class="wv-l3">THIS PAGE REACHED YOU IN <span class="wv-num">997</span> MS FROM FRA</p>
  </div>
</section>

<script>
(() => {
  const section = document.getElementById('wv-hero');
  const canvas  = document.getElementById('wv-pools');
  const gl = canvas.getContext('webgl', {premultipliedAlpha:true, antialias:false, alpha:true});
  if (!gl) return;

  const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

  const FRAG = `
  precision highp float;
  uniform vec2  uRes;
  uniform float uDpr;
  uniform float uRad;
  uniform float uTime;

  float sdRoundRect(vec2 p, vec2 b, float r){
    vec2 q = abs(p) - b + r;
    return length(max(q,0.)) + min(max(q.x,q.y),0.) - r;
  }

  vec3 grad(float t, vec3 a, vec3 b, vec3 c, vec3 d, vec3 e, vec3 f){
    t = clamp(t,0.,1.)*5.;
    if(t<1.) return mix(a,b,t);
    if(t<2.) return mix(b,c,t-1.);
    if(t<3.) return mix(c,d,t-2.);
    if(t<4.) return mix(d,e,t-3.);
    return mix(e,f,t-4.);
  }
  vec3 hex(float r,float g,float b){ return vec3(r,g,b)/255.; }

  const float LOOP = 10.0;
  float pool(vec2 p, vec2 c, vec2 S, float t, float ph){
    float w = 6.2831853 / LOOP;
    float breathe = 1. + 0.28*sin(w*t + ph);
    float spread  = 1. + 0.14*sin(w*t + ph + 1.2);
    // Responsive scaling for desktop and mobile
    vec2  L = vec2(max(0.30*S.x, 0.40*S.x), min(0.42*S.y, 0.54*S.x)) * spread;
    vec2  d = (p - c) / L;
    float r2 = dot(d,d);
    float s = (abs(p.x-c.x) - abs(p.y-c.y)) * 0.012;
    float wob = 1. + 0.13*sin(s*1.1 - 2.*w*t + ph) + 0.05*sin(s*2.3 + 3.*w*t);
    float Tmax = clamp(max(0.135*min(S.x,S.y), 0.16*S.x), 48., 145.);
    return Tmax * breathe * wob * exp(-r2*1.85);
  }

  void main(){
    vec2 S  = uRes / uDpr;
    vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
    float edge  = -sdRoundRect(px - S*0.5, S*0.5, uRad);
    float bigR  = 0.28*min(S.x,S.y);
    float depth = -sdRoundRect(px - S*0.5, S*0.5, bigR);

    float t = uTime;
    float T = max(pool(px, vec2(S.x, 0.), S, t, 0.), pool(px, vec2(0., S.y), S, t, 3.14159));
    vec3 ink = hex(5.,12.,26.);

    if(edge < 0.){
      float g = smoothstep(0., 14., -edge);
      vec3  c = mix(hex(255.,45.,61.), hex(255.,106.,61.), g);
      float a = (1. - g*0.85) * smoothstep(3., 10., T);
      gl_FragColor = vec4(c*a, a); return;
    }
    if(T < 0.5){ gl_FragColor = vec4(0.); return; }

    float rimW = clamp(T*0.22, 3., 16.);
    float rimT = edge / rimW;
    vec3 rimCol = grad(rimT,
      hex(255.,106.,61.),
      hex(255.,45.,61.),
      hex(255.,31.,122.),
      hex(255.,79.,176.),
      hex(42.,31.,168.),
      ink);

    float fw = clamp(T*0.55, 10., 46.);
    float x  = (depth - T) / fw;
    vec3 inCol = grad(x,
      hex(26.,18.,64.),
      hex(47.,75.,255.),
      hex(30.,139.,255.),
      hex(0.,200.,255.),
      hex(127.,243.,255.),
      hex(255.,255.,255.));

    vec3 col;
    float alpha;
    if(depth <= T){
      col   = (edge < rimW) ? rimCol : ink;
      alpha = 1.;
      alpha *= smoothstep(0.5, 6., T);
    } else {
      col   = inCol;
      float fade = 1. - smoothstep(0.55, 1.0, x);
      alpha = fade * smoothstep(2., 14., T);
    }
    gl_FragColor = vec4(col*alpha, alpha);
  }`;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes=U('uRes'), uDpr=U('uDpr'), uRad=U('uRad'), uTime=U('uTime');
  const radius = 0.0;

  let dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = section.getBoundingClientRect();
    canvas.width  = Math.round(r.width  * dpr);
    canvas.height = Math.round(r.height * dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  function draw(t){
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uDpr, dpr);
    gl.uniform1f(uRad, radius);
    gl.uniform1f(uTime, t);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  new ResizeObserver(() => { resize(); if(still) draw(0); }).observe(section);
  resize();
  if(still){ draw(0); return; }
  const fixed = new URLSearchParams(location.search).get('t');
  if(fixed !== null){ draw(parseFloat(fixed)); return; }
  const t0 = performance.now();
  (function loop(){ draw((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
})();

/* ---------- Entrance Animation for Tagline ---------- */
(async () => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const l1Text = document.querySelector('.wv-l1-text');
  const l2 = document.querySelector('.wv-l2');
  const l3 = document.querySelector('.wv-l3');
  const numEl = document.querySelector('.wv-num');
  const container = document.querySelector('.wv-lines');

  if (reduced) {
    if (numEl) numEl.textContent = '997';
    document.documentElement.classList.remove('js');
    return;
  }

  if (numEl) numEl.textContent = '0';

  if (l1Text) {
    const words = l1Text.textContent.trim().split(/\s+/);
    l1Text.innerHTML = words.map((w, i) => {
      const delay = 0.15 + i * 0.06;
      return `<span class="wv-word" style="transition-delay:${delay}s">${w}</span>`;
    }).join(' ');
  }

  if (l2) l2.style.transitionDelay = '0.68s';
  if (l3) l3.style.transitionDelay = '0.88s';

  try {
    await Promise.race([
      document.fonts ? document.fonts.ready : Promise.resolve(),
      new Promise(res => setTimeout(res, 600))
    ]);
  } catch (e) {}

  document.documentElement.classList.remove('js');
  requestAnimationFrame(() => {
    if (container) container.classList.add('wv-animate');
  });

  setTimeout(() => {
    const start = performance.now();
    const duration = 1000;
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const ease = 1 - Math.pow(1 - p, 3);
      if (numEl) numEl.textContent = String(Math.round(997 * ease));
      if (p < 1) requestAnimationFrame(tick);
      else if (numEl) numEl.textContent = '997';
    }
    requestAnimationFrame(tick);
  }, 880);
})();
</script>
</body>
</html>
